distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
# services.gradle.org redirects to github.com/gradle/gradle-distributions, whose
# release downloads answer 504 on 2026-11-08, so the wrapper cannot fetch the
# distribution at all. The mirror below serves the identical artifact.
distributionUrl=https\://mirrors.cloud.tencent.com/gradle/gradle-8.13-bin.zip
networkTimeout=60000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists

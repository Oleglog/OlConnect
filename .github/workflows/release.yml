name: Release APK

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, for example v1.0.0
        required: true
        type: string
  push:
    tags:
      - "v*"

permissions:
  actions: read
  contents: write

jobs:
  build-release-apk:
    runs-on: ubuntu-latest
    env:
      ANDROID_SIGNING_CERT_SHA256: ${{ secrets.ANDROID_SIGNING_CERT_SHA256 }}
    steps:
      - uses: actions/checkout@v4

      - name: Restore mobilecore build cache
        id: mobilecore-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/go/bin/gomobile
            app/libs/mobilecore.aar
          key: mobilecore-${{ runner.os }}-android-all-${{ hashFiles('scripts/build_mobilecore.sh', 'native/mobilecore/go.mod', 'native/mobilecore/go.sum', 'native/mobilecore/**/*.go') }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - uses: actions/setup-go@v5
        with:
          go-version-file: native/mobilecore/go.mod
          cache: true
          cache-dependency-path: native/mobilecore/go.*

      - name: Restore HEV native cache
        uses: actions/cache/restore@v4
        with:
          path: |
            app/src/main/jniLibs
            native/hev-socks5-tunnel/upstream
          key: hev-${{ runner.os }}-ndk-28.2.13676358-${{ hashFiles('scripts/build_hev.sh', 'app/src/main/jni/**') }}

      - name: Install Android SDK components
        run: |
          export PATH="${ANDROID_HOME}/cmdline-tools/latest/bin:${ANDROID_HOME}/tools/bin:${PATH}"
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"

      - name: Prepare release signing
        shell: bash
        run: |
          set -euo pipefail
          test -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" || { echo "ANDROID_KEYSTORE_BASE64 secret is required" >&2; exit 1; }
          test -n "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" || { echo "ANDROID_KEYSTORE_PASSWORD secret is required" >&2; exit 1; }
          test -n "${{ secrets.ANDROID_KEY_ALIAS }}" || { echo "ANDROID_KEY_ALIAS secret is required" >&2; exit 1; }
          test -n "${{ secrets.ANDROID_KEY_PASSWORD }}" || { echo "ANDROID_KEY_PASSWORD secret is required" >&2; exit 1; }
          mkdir -p keystore
          printf '%s' '${{ secrets.ANDROID_KEYSTORE_BASE64 }}' | base64 -d > keystore/olcrtc-release.jks
          cat > keystore.properties <<EOF
          storeFile=keystore/olcrtc-release.jks
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF

      - name: Build native mobilecore
        run: scripts/build_mobilecore.sh
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/28.2.13676358
          MOBILECORE_TARGET: android

      - name: Verify mobilecore AAR dependency metadata
        run: scripts/verify_mobilecore_artifact.sh

      - name: Save mobilecore AAR cache
        if: steps.mobilecore-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/go/bin/gomobile
            app/libs/mobilecore.aar
          key: ${{ steps.mobilecore-cache.outputs.cache-primary-key }}

      - name: Build HEV tunnel
        run: scripts/build_hev.sh
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/28.2.13676358
          HEV_APP_ABI: armeabi-v7a arm64-v8a

      - name: Assemble signed release APK
        run: ./gradlew --no-daemon --build-cache :app:assembleRelease

      - name: Extract signing certificate SHA-256
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-artifacts
          # Extract the signing certificate from the universal APK using apksigner
          APK_PATH="app/build/outputs/apk/release/app-universal-release.apk"

          # Use apksigner to extract certificate from APK Signature Scheme v2/v3
          APKSIGNER="${ANDROID_HOME}/build-tools/$(ls ${ANDROID_HOME}/build-tools | sort -V | tail -1)/apksigner"

          echo "Using apksigner: $APKSIGNER"
          echo "=== APK Signature Info ==="
          "$APKSIGNER" verify --print-certs "$APK_PATH"
          echo "=========================="

          # Extract SHA-256 from first signer certificate
          CERT_SHA256=$("$APKSIGNER" verify --print-certs "$APK_PATH" | \
            grep -i "SHA-256 digest:" | \
            head -1 | \
            awk '{print $3}' | \
            tr -d ':' | \
            tr '[:upper:]' '[:lower:]')

          if [ -z "$CERT_SHA256" ]; then
            echo "Error: Could not extract certificate SHA-256 from APK" >&2
            exit 1
          fi

          echo "Extracted certificate SHA-256: $CERT_SHA256"
          echo "$CERT_SHA256" > release-artifacts/SIGNING_CERT_SHA256.txt

      - name: Package release artifacts
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          mkdir -p release-artifacts
          cp app/build/outputs/apk/release/app-arm64-v8a-release.apk "release-artifacts/olcRTC-Client-${TAG}-arm64-v8a.apk"
          cp app/build/outputs/apk/release/app-armeabi-v7a-release.apk "release-artifacts/olcRTC-Client-${TAG}-armeabi-v7a.apk"
          cp app/build/outputs/apk/release/app-universal-release.apk "release-artifacts/olcRTC-Client-${TAG}-universal.apk"
          (cd release-artifacts && sha256sum *.apk > SHA256SUMS.txt)
          # Append signing certificate SHA-256 to checksums file
          if [ -f release-artifacts/SIGNING_CERT_SHA256.txt ]; then
            echo "" >> release-artifacts/SHA256SUMS.txt
            echo "# APK Signing Certificate SHA-256:" >> release-artifacts/SHA256SUMS.txt
            cat release-artifacts/SIGNING_CERT_SHA256.txt >> release-artifacts/SHA256SUMS.txt
          fi
          cat release-artifacts/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: olcrtc-client-release-apk
          path: release-artifacts/*
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: OlConnect ${{ github.event.inputs.tag || github.ref_name }}
          files: release-artifacts/*
          generate_release_notes: true
          draft: false
          make_latest: true

      - name: Keep latest fifteen GitHub Releases
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            --jq 'map(select(.draft == false)) | sort_by(.published_at) | reverse | .[15:][]?.id' |
          while read -r release_id; do
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/releases/${release_id}"
          done
